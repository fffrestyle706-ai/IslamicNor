<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d2922">
  <title>نور | منصة إسلامية</title>
  <style>
    :root {
      --bg: #081814;
      --surface: #0d2922;
      --surface-2: #12372e;
      --text: #f3f7f5;
      --muted: #a7beb6;
      --accent: #d4af37;
      --accent-soft: rgba(212, 175, 55, 0.14);
      --border: rgba(255, 255, 255, 0.08);
      --font-scale: 1;
      --sidebar-w: 270px;
      --cursor-red: #ff2e4c;
      --cursor-red-glow: rgba(255, 46, 76, 0.45);
    }

    body.light-theme {
      --bg: #f4f7f5;
      --surface: #ffffff;
      --surface-2: #eaf1ed;
      --text: #0f241e;
      --muted: #526860;
      --accent: #0f5c49;
      --accent-soft: rgba(15, 92, 73, 0.1);
      --border: rgba(15, 36, 30, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: calc(16px * var(--font-scale));
    }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* إخفاء مؤشر الماوس الأصلي في الحاسوب فقط */
    @media (hover: hover) and (pointer: fine) {
      body.custom-cursor-active,
      body.custom-cursor-active * {
        cursor: none !important;
      }
    }

    /* النقطة الحمراء والأنيميشن */
    .cursor-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
      display: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .cursor-layer {
        display: block;
      }
    }

    .cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      margin-top: -6px;
      border-radius: 50%;
      background: var(--cursor-red);
      box-shadow: 0 0 14px var(--cursor-red), 0 0 28px var(--cursor-red-glow);
      transform: translate3d(-100px, -100px, 0) scale(1);
      transition: width 0.18s ease, height 0.18s ease, margin 0.18s ease, background 0.18s ease;
      will-change: transform;
    }

    .cursor-ring {
      position: fixed;
      top: 0;
      left: 0;
      width: 34px;
      height: 34px;
      margin-left: -17px;
      margin-top: -17px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 46, 76, 0.65);
      background: radial-gradient(circle, rgba(255, 46, 76, 0.12) 0%, rgba(255, 46, 76, 0) 70%);
      transform: translate3d(-100px, -100px, 0) scale(1);
      transition: width 0.22s ease, height 0.22s ease, margin 0.22s ease, border-color 0.22s ease, background 0.22s ease;
      will-change: transform;
    }

    body.cursor-hover .cursor-dot {
      width: 16px;
      height: 16px;
      margin-left: -8px;
      margin-top: -8px;
      background: #ff4d67;
    }

    body.cursor-hover .cursor-ring {
      width: 48px;
      height: 48px;
      margin-left: -24px;
      margin-top: -24px;
      border-color: rgba(255, 77, 103, 0.9);
      background: radial-gradient(circle, rgba(255, 46, 76, 0.2) 0%, rgba(255, 46, 76, 0) 72%);
    }

    body.cursor-down .cursor-dot {
      transform: translate3d(var(--dx, -100px), var(--dy, -100px), 0) scale(0.75);
    }

    .cursor-trail {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      margin-top: -4px;
      border-radius: 50%;
      background: rgba(255, 46, 76, 0.55);
      box-shadow: 0 0 10px rgba(255, 46, 76, 0.4);
      pointer-events: none;
      animation: trailFade 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes trailFade {
      0% {
        opacity: 0.85;
        transform: translate3d(var(--tx), var(--ty), 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--tx), var(--ty), 0) scale(0.15);
      }
    }

    .cursor-ripple {
      position: fixed;
      top: 0;
      left: 0;
      width: 18px;
      height: 18px;
      margin-left: -9px;
      margin-top: -9px;
      border-radius: 50%;
      border: 2px solid var(--cursor-red);
      box-shadow: 0 0 18px var(--cursor-red-glow);
      pointer-events: none;
      animation: rippleBurst 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes rippleBurst {
      0% {
        opacity: 0.95;
        transform: translate3d(var(--rx), var(--ry), 0) scale(0.4);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--rx), var(--ry), 0) scale(4.2);
      }
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* القائمة الجانبية */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-inline-start: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.25rem 1rem;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 40;
      transition: transform 0.25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
      padding: 0.4rem 0.5rem 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--accent);
      color: #081814;
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      font-weight: 800;
    }

    .brand strong {
      display: block;
      font-size: 1.15rem;
    }

    .brand small {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-top: 1rem;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      font-size: 0.95rem;
      text-align: right;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .nav-item:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .sidebar-note {
      background: var(--surface-2);
      padding: 0.75rem;
      border-radius: 10px;
      font-size: 0.85rem;
      color: var(--accent);
      text-align: center;
    }

    .theme-toggle {
      width: 100%;
      padding: 0.65rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* المحتوى الرئيسي */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .menu-btn {
      display: none;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 38px;
      height: 38px;
      font-size: 1.15rem;
      cursor: pointer;
    }

    .search-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.45rem 0.8rem;
    }

    .search-wrap input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .today-pill {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .icon-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      cursor: pointer;
      font-weight: 700;
    }

    .content {
      flex: 1;
      padding: 1.5rem;
      max-width: 1100px;
      width: 100%;
      margin-inline: auto;
    }

    .section-header {
      margin-bottom: 1.25rem;
    }

    .section-header h1 {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }

    .section-header p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.9rem;
    }

    .card h3 {
      font-size: 1.05rem;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }

    .card p {
      color: var(--text);
      font-size: 0.95rem;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s, color 0.2s;
    }

    .btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* المسبحة */
    .tasbih-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem 1.25rem;
      text-align: center;
      max-width: 460px;
      margin: 1rem auto;
    }

    .tasbih-count {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--accent);
      margin: 0.75rem 0;
    }

    .tasbih-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      background: var(--accent-soft);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      margin: 0.5rem auto 1rem;
      display: block;
    }

    /* التذييل والتنبيه */
    .footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    .toast {
      position: fixed;
      bottom: 1.25rem;
      left: 1.25rem;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 0.65rem 1rem;
      border-radius: 10px;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* تجاوب الشاشات الصغيرة */
    @media (max-width: 860px) {
      .menu-btn {
        display: inline-grid;
        place-items: center;
      }

      .sidebar {
        position: fixed;
        right: 0;
        transform: translateX(100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>
  <div class="cursor-layer" id="cursorLayer" aria-hidden="true">
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-dot" id="cursorDot"></div>
  </div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="نور الرئيسية">
        <span class="brand-mark">ن</span><span><strong>نُور</strong><small>رفيق الذكر اليومي</small></span>
      </a>
      <nav class="nav-list" aria-label="القائمة الرئيسية">
        <button class="nav-item active" data-view="home"><span>⌂</span> الرئيسية</button>
        <button class="nav-item" data-view="morning"><span>☀</span> أذكار الصباح</button>
        <button class="nav-item" data-view="evening"><span>☾</span> أذكار المساء</button>
        <button class="nav-item" data-view="sleep"><span>✦</span> أذكار النوم</button>
        <button class="nav-item" data-view="tasbih"><span>◉</span> المسبحة الإلكترونية</button>
        <button class="nav-item" data-view="duas"><span>♡</span> أدعية متنوعة</button>
        <button class="nav-item" data-view="learn"><span>✧</span> تعلم الإسلام</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-note"><span>✧</span><p>﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾</p></div>
        <button id="themeBtn" class="theme-toggle"><span>◐</span> تغيير المظهر</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="فتح القائمة">☰</button>
        <div class="search-wrap"><span>⌕</span><input id="searchInput" type="search" placeholder="بحث في الأذكار والأدعية..." aria-label="بحث"></div>
        <div class="top-actions"><span class="today-pill" id="dateText">اليوم</span><button class="icon-btn" id="fontBtn" title="تكبير الخط">A+</button></div>
      </header>
      <section id="content" class="content"></section>
      <footer class="footer">DEV BY FARID</footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const state = {
      view: "home",
      search: "",
      fontScale: 1,
      tasbihCount: Number(localStorage.getItem("noor_tasbih") || 0)
    };

    const itemsData = [
      {

      {

      },
      {

      },
      {

        view: "evening",
        title: "ذكر المساء - الاستعاذة من الشرور",

      {
        id: "e3",
        view: "evening",

      {
        id: "s1",

      {
        id: "d4",

      },
      {

        text: "اللهم لا سهل إلا ما جعلته سهلاً وأنت تجعل الحزن إذا شئت سهلاً."

      {

      },
      {
        id: "l1",
        view: "learn",
        title: "أركان الإسلام الخمسة",
        text: "الشهادتان، وإقام الصلاة، وإيتاء الزكاة، وصوم رمضان، وحج البيت لمن استطاع إليه سبيلاً."
      },
      {
        id: "l2",
        view: "learn",
        title: "أركان الإيمان الستة",
        text: "أن تؤمن بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، وتؤمن بالقدر خيره وشره."
      }
    ];

    const viewTitles = {
      home: { title: "مرحباً بك في منصة نور", desc: "اختر قسماً من القائمة أو ابحث عن محتوى للذكر والأدعية." },
      morning: { title: "أذكار الصباح", desc: "أذكار بداية اليوم لتجديد النية والسكينة." },
      evening: { title: "أذكار المساء", desc: "أذكار ختام النهار وحفظ النفس." },
      sleep: { title: "أذكار النوم", desc: "تهيئة القلب للنوم على ذكر الله." },
      tasbih: { title: "المسبحة الإلكترونية", desc: "عداد تسبيح بسيط يحفظ تقدمك تلقائياً." },
      duas: { title: "أدعية متنوعة", desc: "أدعية جامعة للعلم والهداية وتيسير الأمور والوالدين." },
      learn: { title: "تعلم الإسلام", desc: "أساسيات ومفاهيم ميسرة." }
    };

    const contentEl = document.getElementById("content");
    const sidebarEl = document.getElementById("sidebar");
    const menuBtn = document.getElementById("menuBtn");
    const searchInput = document.getElementById("searchInput");
    const fontBtn = document.getElementById("fontBtn");
    const themeBtn = document.getElementById("themeBtn");
    const dateText = document.getElementById("dateText");
    const toastEl = document.getElementById("toast");

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function saveTasbih() {
      localStorage.setItem("noor_tasbih", String(state.tasbihCount));
    }

    function renderCard(item) {
      return `
        <article class="card">
          <div>
            <h3>${item.title}</h3>
            <p>${item.text}</p>
          </div>
        </article>
      `;
    }

    function renderTasbih() {
      return `
        <div class="tasbih-box">
          <h2>سبّح واذكر الله</h2>
          <div class="tasbih-count" id="tasbihValue">${state.tasbihCount}</div>
          <button class="tasbih-btn" id="incTasbihBtn">سبّح (+1)</button>
          <div class="card-actions" style="justify-content:center">
            <button class="btn" id="resetTasbihBtn">تصفير العداد</button>
          </div>
        </div>
      `;
    }

    function bindTasbihEvents() {
      const incBtn = document.getElementById("incTasbihBtn");
      const resetBtn = document.getElementById("resetTasbihBtn");
      const valEl = document.getElementById("tasbihValue");

      incBtn?.addEventListener("click", () => {
        state.tasbihCount += 1;
        valEl.textContent = state.tasbihCount;
        saveTasbih();
      });

      resetBtn?.addEventListener("click", () => {
        state.tasbihCount = 0;
        valEl.textContent = 0;
        saveTasbih();
        showToast("تم تصفير المسبحة");
      });
    }

    function render() {
      const meta = viewTitles[state.view] || viewTitles.home;
      const q = state.search.trim().toLowerCase();

      let list = itemsData;
      if (state.view !== "home" && state.view !== "tasbih") {
        list = itemsData.filter((item) => item.view === state.view);
      }

      if (q) {
        list = itemsData.filter(
          (item) => item.title.toLowerCase().includes(q) || item.text.toLowerCase().includes(q)
        );
      }

      const bodyHtml =
        state.view === "tasbih" && !q
          ? renderTasbih()
          : list.length
          ? `<div class="grid-cards">${list.map(renderCard).join("")}</div>`
          : `<div class="card"><p>لا توجد عناصر مطابقة للعرض حالياً.</p></div>`;

      contentEl.innerHTML = `
        <div class="section-header">
          <h1>${q ? `نتائج البحث عن: "${state.search}"` : meta.title}</h1>
          <p>${meta.desc}</p>
        </div>
        ${bodyHtml}
      `;

      if (state.view === "tasbih" && !q) {
        bindTasbihEvents();
      }
    }

    document.querySelectorAll(".nav-item").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        state.view = btn.dataset.view || "home";
        sidebarEl.classList.remove("open");
        render();
      });
    });

    menuBtn?.addEventListener("click", () => {
      sidebarEl.classList.toggle("open");
    });

    searchInput?.addEventListener("input", (e) => {
      state.search = e.target.value;
      render();
    });

    fontBtn?.addEventListener("click", () => {
      state.fontScale = state.fontScale >= 1.25 ? 1 : Number((state.fontScale + 0.1).toFixed(2));
      document.documentElement.style.setProperty("--font-scale", state.fontScale);
      showToast(`حجم الخط: ${Math.round(state.fontScale * 100)}%`);
    });

    themeBtn?.addEventListener("click", () => {
      document.body.classList.toggle("light-theme");
      showToast("تم تغيير المظهر");
    });

    if (dateText) {
      dateText.textContent = new Intl.DateTimeFormat("ar-MA", {
        weekday: "long",
        day: "numeric",
        month: "long"
      }).format(new Date());
    }

    // أنيميشن النقطة الحمراء للماوس
    (function initRedDotCursor() {
      const hasFinePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      if (!hasFinePointer) return;

      const cursorLayer = document.getElementById("cursorLayer");
      const dot = document.getElementById("cursorDot");
      const ring = document.getElementById("cursorRing");
      if (!cursorLayer || !dot || !ring) return;

      document.body.classList.add("custom-cursor-active");

      let mouseX = -100;
      let mouseY = -100;
      let ringX = -100;
      let ringY = -100;
      let lastTrailTime = 0;

      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        dot.style.setProperty("--dx", `${mouseX}px`);
        dot.style.setProperty("--dy", `${mouseY}px`);
        dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;

        const now = performance.now();
        if (now - lastTrailTime > 28) {
          lastTrailTime = now;
          const trail = document.createElement("div");
          trail.className = "cursor-trail";
          trail.style.setProperty("--tx", `${mouseX}px`);
          trail.style.setProperty("--ty", `${mouseY}px`);
          cursorLayer.appendChild(trail);
          trail.addEventListener("animationend", () => trail.remove(), { once: true });
        }
      });

      document.addEventListener("mousedown", (e) => {
        document.body.classList.add("cursor-down");
        const ripple = document.createElement("div");
        ripple.className = "cursor-ripple";
        ripple.style.setProperty("--rx", `${e.clientX}px`);
        ripple.style.setProperty("--ry", `${e.clientY}px`);
        cursorLayer.appendChild(ripple);
        ripple.addEventListener("animationend", () => ripple.remove(), { once: true });
      });

      document.addEventListener("mouseup", () => {
        document.body.classList.remove("cursor-down");
      });

      document.addEventListener("mouseover", (e) => {
        const interactive = e.target.closest("button, a, input, .card");
        document.body.classList.toggle("cursor-hover", Boolean(interactive));
      });

      document.addEventListener("mouseleave", () => {
        dot.style.transform = "translate3d(-100px, -100px, 0)";
        ring.style.transform = "translate3d(-100px, -100px, 0)";
      });

      function animateRing() {
        ringX += (mouseX - ringX) * 0.16;
        ringY += (mouseY - ringY) * 0.16;
        ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;
        requestAnimationFrame(animateRing);
      }
      requestAnimationFrame(animateRing);
    })();

    render();
  </script>
</body>
</html>
